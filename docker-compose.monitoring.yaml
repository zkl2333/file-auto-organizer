# 带监控和健康检查的 Docker Compose 配置
# 使用方法: docker-compose -f docker-compose.monitoring.yaml up -d

services:
  file-classifier:
    image: docker.io/zkl2333/file-auto-organizer:latest
    container_name: file-classifier
    restart: unless-stopped
    
    # 健康检查 - 确保进程存活
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep -v grep | grep -q 'bun'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # 资源限制 - 防止被系统暂停
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    
    volumes:
      # 宿主机下载目录挂载到容器内 /data
      - ~/Downloads:/data:rw
      # 日志输出目录
      - ./logs:/app/logs:rw
      # 配置文件挂载
      - ./config.yaml:/app/config.yaml:ro
    
    working_dir: /app
    
    # 日志配置 - 防止日志过大
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 环境变量
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
    
    # 添加标签用于监控
    labels:
      - "com.docker.compose.project=file-auto-organizer"
      - "monitoring.enabled=true"
