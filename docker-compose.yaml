services:
  file-auto-organizer:
    build: .
    container_name: file-auto-organizer
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      # 宿主机下载目录挂载到容器内 /data
      - ~/Downloads:/data:rw
      # 日志输出目录
      - ./logs:/app/logs:rw
      # 配置文件挂载
      - ./config.yaml:/app/config.yaml:ro
    working_dir: /app
    environment:
      - NODE_ENV=production
      - PORT=3000
