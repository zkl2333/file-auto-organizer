services:
  file-auto-organizer:
    build: .
    container_name: file-auto-organizer
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      # 宿主机下载目录挂载到容器内 /data
      - ~/Downloads:/data:rw
      # 配置和数据目录（包含 config.yaml 和 logs）
      - ./.config:/app/.config:rw
    working_dir: /app
